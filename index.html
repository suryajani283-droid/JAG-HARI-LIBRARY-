<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAG HARI LIBRARY | Booking</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

    <div class="container" id="authSection" style="display: block;">
        <div class="card">
            <h2 class="brand-name">JAG HARI LIBRARY</h2>
            <p class="subtitle">Digital Seat Reservation</p>
            <div class="form-group">
                <label>Student Name</label>
                <input type="text" id="userName" placeholder="Enter Full Name" required>
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="userMobile" placeholder="91XXXXXXXX">
            </div>
            <button type="button" class="btn-primary" onclick="startBookingFlow()">Continue to Seats</button>
        </div>
    </div>

    <div class="container" id="bookingSection" style="display: none;">
        <header class="booking-header">
            <h1>Select Your Seat</h1>
            <p>JAG HARI LIBRARY - Barmer</p>
        </header>

        <div id="libraryLayout"></div>

        <div class="pricing-section">
            <div class="date-picker-box">
                <label><strong>1. Joining Date:</strong></label>
                <input type="date" id="startDate" onchange="updateInfo()">
            </div>
            
            <label><strong>2. Membership Plan:</strong></label>
            <div class="plans">
                <div class="plan-card active" onclick="setPlan(599, 1, this)">
                    <h4>1 Month</h4>
                    <p>₹599</p>
                </div>
                <div class="plan-card" onclick="setPlan(1699, 3, this)">
                    <h4>3 Months</h4>
                    <p>₹1699</p>
                </div>
                <div class="plan-card" onclick="setPlan(3200, 6, this)">
                    <h4>6 Months</h4>
                    <p>₹3200</p>
                </div>
            </div>
            <div id="validityInfo" class="validity-badge"></div>
            <button type="button" class="btn-pay" onclick="handlePay()">Book & Pay ₹<span id="priceText">599</span></button>
        </div>
    </div>

    <div id="receiptModal" class="modal" style="display: none;">
        <div class="receipt-card">
            <div class="receipt-banner">
                <h2>JAG HARI LIBRARY</h2>
                <p>Payment Successful</p>
            </div>
            <div class="receipt-content">
                <p><strong>Student:</strong> <span id="rName"></span></p>
                <div class="receipt-grid">
                    <div class="r-item"><strong>Seat</strong><p id="rSeat"></p></div>
                    <div class="r-item"><strong>Plan</strong><p id="rPlan"></p></div>
                    <div class="r-item"><strong>Paid</strong><p>₹<span id="rAmt"></span></p></div>
                    <div class="r-item"><strong>Expiry</strong><p id="rExpiry"></p></div>
                </div>
                <p style="font-size: 10px; color: #666; margin-top: 15px;">Txn ID: <span id="rID"></span></p>
            </div>
            <div class="receipt-footer">
                <button class="btn-primary" onclick="window.print()" style="margin-bottom: 5px;">Print Receipt</button>
                <button class="btn-close" onclick="location.reload()" style="width: 100%; background: none; border: none; cursor: pointer;">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
