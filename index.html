<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAG HARI LIBRARY | Online Booking</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container" id="authSection">
        <div class="card">
            <h2 class="brand-name">JAG HARI LIBRARY</h2>
            <p class="subtitle">Digital Booking Portal</p>
            <div class="form-group">
                <label>Student Name</label>
                <input type="text" id="userName" placeholder="Enter Full Name">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="userMobile" placeholder="+91">
            </div>
            <div class="form-group">
                <label>Course / Study</label>
                <input type="text" id="userCourse" placeholder="e.g. UPSC, SSC, NEET">
            </div>
            <button class="btn-primary" onclick="showBooking()">Continue to Seats</button>
        </div>
    </div>

    <div class="container hidden" id="bookingSection">
        <header class="booking-header">
            <h1>Select Your Seat</h1>
            <p>Choose a seat and select your joining date</p>
        </header>

        <div id="libraryLayout"></div>

        <div class="pricing-section">
            <div class="date-picker-box">
                <label><strong>1. Joining Date:</strong></label>
                <input type="date" id="startDate" onchange="calculateExpiry()">
            </div>
            
            <label><strong>2. Membership Plan:</strong></label>
            <div class="plans">
                <div class="plan-card active" onclick="selectPlan(599, 1, this)">
                    <h4>1 Month</h4>
                    <p>₹599</p>
                </div>
                <div class="plan-card" onclick="selectPlan(1699, 3, this)">
                    <h4>3 Months</h4>
                    <p>₹1699</p>
                </div>
                <div class="plan-card" onclick="selectPlan(3200, 6, this)">
                    <h4>6 Months</h4>
                    <p>₹3200</p>
                </div>
            </div>
            <div id="validityInfo" class="validity-badge">Calculating validity...</div>
            <button class="btn-pay" onclick="payNow()">Book & Pay ₹<span id="displayPrice">599</span></button>
        </div>
    </div>

    <div id="receiptModal" class="modal hidden" style="display: none;">
        <div class="receipt-card">
            <div class="receipt-banner">
                <h2>JAG HARI LIBRARY</h2>
                <p>Official Booking Confirmation</p>
            </div>
            <div class="receipt-content">
                <div class="receipt-row">
                    <span><strong>Student:</strong> <span id="rName"></span></span>
                    <span><strong>Mobile:</strong> <span id="rMobile"></span></span>
                </div>
                <div class="receipt-grid">
                    <div class="r-item"><strong>Seat No</strong><p id="rSeat"></p></div>
                    <div class="r-item"><strong>Plan</strong><p id="rPlan"></p></div>
                    <div class="r-item"><strong>Amount</strong><p>₹<span id="rAmt"></span></p></div>
                    <div class="r-item"><strong>Expiry</strong><p id="rExpiry"></p></div>
                </div>
                <p class="txn-id">Txn ID: <span id="rID"></span></p>
            </div>
            <div class="receipt-footer">
                <button class="btn-print" onclick="window.print()">Print PDF Receipt</button>
                <button class="btn-close" onclick="location.reload()">Done</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
